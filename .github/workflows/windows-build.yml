name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' }}

jobs:
  runner_probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner startup
        run: echo runner-started

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build Release x64
        shell: pwsh
        run: ./build_windows.ps1

      - name: Run diagnostics regression tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixtures = Get-ChildItem $env:TEMP -Directory -Filter 'BodycamDiagnostics-test-*'
          if (-not $fixtures) { throw 'Missing diagnostics JSON fixtures' }
          foreach ($dir in $fixtures) {
            foreach ($name in @('environment_capabilities.json', 'windows_events.json', 'windows_events_partial.json', 'windows_events_clock_change.json', 'validation.json')) {
              Get-Content -Raw (Join-Path $dir.FullName $name) | ConvertFrom-Json | Out-Null
            }
            $partial = Get-Content -Raw (Join-Path $dir.FullName 'windows_events_partial.json') | ConvertFrom-Json
            if ($partial.channels.sources[0].status -ne 'partial') { throw 'Partial source evidence lost' }
            if ($partial.events[0].stutter_matches.Count -ne 1 -or $partial.events[0].stutter_matches[0].distance_from_interval_ms -ne 0) { throw 'Long-stall interval correlation failed' }
            $clockChange = Get-Content -Raw (Join-Path $dir.FullName 'windows_events_clock_change.json') | ConvertFrom-Json
            if ($clockChange.events[0].stutter_matches.Count -ne 0) { throw 'Clock discontinuity must disable correlation' }
            $validation = Get-Content -Raw (Join-Path $dir.FullName 'validation.json') | ConvertFrom-Json
            if (-not $validation.valid -or $validation.warnings.Count -eq 0) { throw 'Optional-source validation policy failed' }
            Remove-Item -Recurse -Force $dir.FullName
          }
          & ./tests/RuntimeToolSourceTests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/EnvironmentSelfTestTests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare runtime package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Tools | Out-Null
          Copy-Item build/Release/BodycamDiagnostics.exe dist/BodycamDiagnostics.exe
          Copy-Item build/Release/BodycamFullscreenOverlay.exe dist/BodycamFullscreenOverlay.exe
          Copy-Item EnableFullscreenOverlay.ps1 dist/EnableFullscreenOverlay.ps1
          Copy-Item EnableFullscreenOverlay.cmd dist/EnableFullscreenOverlay.cmd
          Copy-Item settings.example.ini dist/settings.example.ini
          Copy-Item СПРАВКА.txt dist/СПРАВКА.txt
          $helpText = Get-Content -Raw -Encoding UTF8 dist/СПРАВКА.txt
          if ($helpText -notmatch 'F8' -or $helpText -notmatch 'Gizmo' -or $helpText -notmatch 'VALID') { throw 'Russian help is incomplete' }
          Copy-Item runtime-tools.sha256 dist/runtime-tools.sha256
          Copy-Item runtime-tools.sources.json dist/runtime-tools.sources.json
          Copy-Item InstallRuntimeTools.ps1 dist/InstallRuntimeTools.ps1
          Copy-Item InstallRuntimeTools.cmd dist/InstallRuntimeTools.cmd
          Copy-Item ValidateEnvironment.ps1 dist/ValidateEnvironment.ps1
          Copy-Item ValidateEnvironment.cmd dist/ValidateEnvironment.cmd
          @"
          Preferred: put these files in this Tools folder before running a test:

          PresentMon.exe
          ffmpeg.exe

          Restricted/Gizmo fallback: the same files may be placed directly beside BodycamDiagnostics.exe.
          Bodycam Diagnostics prefers Tools\ when both locations exist.
          Fast path: run InstallRuntimeTools.cmd beside BodycamDiagnostics.exe.
          It downloads pinned release assets and verifies SHA-256 before installing them.
          Keep runtime-tools.sha256 and runtime-tools.sources.json beside BodycamDiagnostics.exe.
          Bodycam Diagnostics verifies both tools against the hash manifest before execution.
          ffmpeg.exe must provide h264_nvenc and ddagrab.
          "@ | Set-Content -Encoding UTF8 dist/Tools/README.txt

      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @(
            'dist/BodycamDiagnostics.exe',
            'dist/BodycamFullscreenOverlay.exe',
            'dist/EnableFullscreenOverlay.ps1',
            'dist/EnableFullscreenOverlay.cmd',
            'dist/settings.example.ini',
            'dist/СПРАВКА.txt',
            'dist/runtime-tools.sha256',
            'dist/runtime-tools.sources.json',
            'dist/InstallRuntimeTools.ps1',
            'dist/InstallRuntimeTools.cmd',
            'dist/ValidateEnvironment.ps1',
            'dist/ValidateEnvironment.cmd'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ASCII dist/checksums.sha256

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: BodycamDiagnostics-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "stable-$shortSha"
          gh release create $tag `
            dist/BodycamDiagnostics.exe `
            dist/BodycamFullscreenOverlay.exe `
            dist/EnableFullscreenOverlay.ps1 `
            dist/EnableFullscreenOverlay.cmd `
            dist/settings.example.ini `
            dist/runtime-tools.sha256 `
            dist/runtime-tools.sources.json `
            dist/InstallRuntimeTools.ps1 `
            dist/InstallRuntimeTools.cmd `
            dist/ValidateEnvironment.ps1 `
            dist/ValidateEnvironment.cmd `
            dist/checksums.sha256 `
            --target $env:GITHUB_SHA `
            --title "BodycamDiagnostics stable $shortSha" `
            --notes "Stable Windows x64 build. PresentMon.exe and ffmpeg.exe remain external. Run InstallRuntimeTools.cmd to download pinned verified releases, or provide matching binaries manually. Accepted SHA-256 values are defined by runtime-tools.sha256."
