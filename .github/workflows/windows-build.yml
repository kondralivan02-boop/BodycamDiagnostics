name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build Release x64
        shell: pwsh
        run: ./build_windows.ps1

      - name: Upload BodycamDiagnostics.exe
        uses: actions/upload-artifact@v4
        with:
          name: BodycamDiagnostics-windows-x64
          path: build/Release/BodycamDiagnostics.exe
          if-no-files-found: error
