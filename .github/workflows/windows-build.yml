name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build Release x64
        shell: pwsh
        run: ./build_windows.ps1

      - name: Prepare runtime package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Tools | Out-Null
          Copy-Item build/Release/BodycamDiagnostics.exe dist/BodycamDiagnostics.exe
          Copy-Item settings.example.ini dist/settings.example.ini
          @"
          Put these files in this Tools folder before running a test:

          PresentMon.exe
          ffmpeg.exe

          Bodycam Diagnostics checks both tools before starting capture.
          ffmpeg.exe must provide h264_nvenc and ddagrab.
          "@ | Set-Content -Encoding UTF8 dist/Tools/README.txt

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: BodycamDiagnostics-windows-x64
          path: dist/
          if-no-files-found: error
